# NOTE: heap lowered from template default 8G — this build VM has ~6GB RAM.
# The trustStore entries are sandbox-only (egress proxy does TLS interception)
# and MUST be removed on a normal dev machine / Toha's PC.
org.gradle.jvmargs=-Djava.net.preferIPv4Stack=true -Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Djavax.net.ssl.trustStore=/home/hatch/android-sdk/hatch-ca.jks -Djavax.net.ssl.trustStorePassword=changeit
android.useAndroidX=true
android.enableJetifier=true
